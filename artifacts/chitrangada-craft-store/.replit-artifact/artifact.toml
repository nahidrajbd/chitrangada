kind = "web"
previewPath = "/"
title = "Chitrangada Craft Store"
description = "A warm, mobile-friendly storefront for Chitrangada, a local craft store in Rajshahi. Showcases handmade pieces, the shop story, customer love, location details, and easy contact actions."
version = "1.0.0"
id = "artifacts/chitrangada-craft-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18439

[services.development]
run = "pnpm --filter @workspace/chitrangada-craft-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chitrangada-craft-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/chitrangada-craft-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18439"
BASE_PATH = "/"
